<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Cars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<!-- ✅ Top Bar -->
<nav class="bg-black/80 backdrop-blur border-b border-white/10 sticky top-0 z-10">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a th:href="@{/}" class="text-xl font-bold">Car Sale</a>
            <span class="text-xs px-2 py-1 rounded-full bg-yellow-500/15 text-yellow-300 border border-yellow-500/20">
        Admin
      </span>
        </div>

        <div class="flex items-center gap-2">
            <a th:href="@{/cars/add}"
               class="px-4 py-2 rounded-lg bg-yellow-500 text-black hover:bg-yellow-600 font-semibold">
                + Add Car
            </a>

            <a th:href="@{/logout}"
               class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600">
                Logout
            </a>
        </div>
    </div>
</nav>

<section class="container mx-auto px-4 py-8">
    <div class="flex items-end justify-between gap-4 flex-wrap mb-6">
        <div>
            <h1 class="text-3xl font-bold">Manage Cars</h1>
            <p class="text-gray-300 mt-1">Update or delete cars. Images preview shown.</p>
        </div>
        <div class="w-full sm:w-80">
            <input id="searchInput" type="text" placeholder="Search brand/model..."
                   class="w-full p-3 rounded-xl bg-gray-800 border border-white/10 focus:outline-none focus:ring-2 focus:ring-yellow-500/60" />
        </div>
    </div>

    <!-- ✅ Table -->
    <div class="overflow-hidden rounded-2xl border border-white/10 bg-gray-800 shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-black/40 text-gray-200 text-sm">
                <tr>
                    <th class="px-4 py-3">Car</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3">Year</th>
                    <th class="px-4 py-3">Price</th>
                    <th class="px-4 py-3">AVAlIABILITY</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                </tr>
                </thead>

                <tbody id="carsTbody" class="divide-y divide-white/10">
                <tr th:each="car : ${cars}" class="hover:bg-white/5 transition"
                    th:attr="data-search=${(car.brand + ' ' + car.model)}">

                    <!-- Car -->
                    <td class="px-4 py-4">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-14 rounded-xl overflow-hidden bg-gray-700 flex-shrink-0">
                                <img th:if="${car.imagesBase64 != null && #lists.size(car.imagesBase64) > 0}"
                                     th:src="'data:image/jpeg;base64,' + ${car.imagesBase64[0]}"
                                     class="w-full h-full object-cover" alt="Car" />
                                <div th:if="${car.imagesBase64 == null || #lists.size(car.imagesBase64) == 0}"
                                     class="w-full h-full grid place-items-center text-gray-300 text-xs">
                                    No image
                                </div>
                            </div>

                            <div>
                                <div class="font-semibold text-lg" th:text="${car.brand + ' ' + car.model}">Brand Model</div>
                                <div class="text-sm text-gray-300">
                                    ID:
                                    <span th:text="${car.id}">1</span>
                                </div>
                            </div>
                        </div>
                    </td>

                    <!-- Status -->
                    <td class="px-4 py-4">
              <span th:text="${car.status}"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold
                           bg-white/10 border border-white/10">
                USED
              </span>
                    </td>

                    <!-- Year -->
                    <td class="px-4 py-4 text-gray-200" th:text="${car.year}">2020</td>

                    <!-- Price -->
                    <td class="px-4 py-4">
                        <span class="text-yellow-300 font-semibold" th:text="'$' + ${car.price}">$10000</span>
                    </td>

                    <td class="px-4 py-4">
              <span th:text="${car.availability}"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold
                           bg-white/10 border border-white/10">
                AVAILABLE
              </span>
                    </td>

                    <!-- Actions -->
                    <td class="px-4 py-4">
                        <div class="flex items-center justify-end gap-2">

                            <!-- Edit -->
                            <a th:href="@{/admin/cars/{id}/edit(id=${car.id})}"
                               class="px-4 py-2 bg-blue-600 text-white rounded">
                                Edit
                            </a>


                            <!-- Delete (opens modal) -->
                            <button type="button"
                                    class="px-4 py-2 rounded-lg bg-red-500/20 border border-red-500/30 text-red-200 hover:bg-red-500/30"
                                    th:attr="data-id=${car.id}, data-name=${car.brand + ' ' + car.model}"
                                    onclick="openDeleteModal(this)">
                                Delete
                            </button>

                        </div>
                    </td>
                </tr>

                <tr th:if="${cars == null || #lists.isEmpty(cars)}">
                    <td colspan="5" class="px-4 py-10 text-center text-gray-300">
                        No cars found.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- ✅ Delete Modal -->
<div id="deleteModal" class="fixed inset-0 hidden items-center justify-center bg-black/70 p-4 z-50">
    <div class="w-full max-w-md rounded-2xl bg-gray-900 border border-white/10 shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-white/10">
            <h3 class="text-xl font-bold">Delete car?</h3>
            <p class="text-gray-300 mt-1">This action cannot be undone.</p>
        </div>

        <div class="p-5">
            <div class="bg-gray-800 border border-white/10 rounded-xl p-4">
                <div class="text-sm text-gray-300">Car</div>
                <div id="deleteCarName" class="font-semibold text-lg">—</div>
            </div>

            <form id="deleteForm" method="post" class="mt-5 flex gap-2 justify-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button type="button" onclick="closeDeleteModal()"
                        class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600">Cancel</button>

                <button type="submit"
                        class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 font-semibold">Delete</button>
            </form>

        </div>
    </div>
</div>

<script>
    // ✅ Client-side search filter
    const searchInput = document.getElementById("searchInput");
    const rows = () => Array.from(document.querySelectorAll("#carsTbody tr[data-search]"));

    if (searchInput) {
        searchInput.addEventListener("input", () => {
            const q = (searchInput.value || "").toLowerCase().trim();
            rows().forEach(r => {
                const txt = (r.getAttribute("data-search") || "").toLowerCase();
                r.style.display = txt.includes(q) ? "" : "none";
            });
        });
    }

    // ✅ Delete modal logic
    const modal = document.getElementById("deleteModal");
    const nameEl = document.getElementById("deleteCarName");
    const form = document.getElementById("deleteForm");

    function openDeleteModal(btn) {
        const id = btn.getAttribute("data-id");
        const name = btn.getAttribute("data-name");

        nameEl.textContent = name || "—";

        // POST to /admin/cars/{id}/delete (simple)
        form.action = `/admin/cars/${id}/delete`;

        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

    function closeDeleteModal() {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }

    // Close when clicking outside
    modal?.addEventListener("click", (e) => {
        if (e.target === modal) closeDeleteModal();
    });
</script>

</body>
</html>
