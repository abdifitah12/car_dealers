<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Cars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">

<!-- ✅ Top Navbar -->
<nav class="bg-black/80 backdrop-blur border-b border-white/10 sticky top-0 z-10">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between gap-3">

        <div class="flex items-center gap-3">
            <a th:href="@{/admin/cars}" class="text-xl font-bold hover:text-yellow-300 transition">
                Car Sale
            </a>

            <span class="text-xs px-2 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">
                Finance List
            </span>
        </div>

        <div class="flex items-center gap-2">
            <a th:href="@{/admin/cars}"
               class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-semibold">
                Back to Admin
            </a>

            <a th:href="@{/logout}"
               class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 font-semibold">
                Logout
            </a>
        </div>
    </div>
</nav>


<section class="container mx-auto px-4 py-8">

    <!-- Title -->
    <div class="flex items-end justify-between gap-4 flex-wrap mb-6">
        <div>
            <h1 class="text-3xl font-bold text-emerald-300">Finance Cars</h1>
            <p class="text-gray-300 mt-1">
                These cars are marked for finance payments.
            </p>
        </div>

        <!-- Search -->
        <div class="w-full sm:w-80">
            <input id="searchInput" type="text" placeholder="Search brand/model..."
                   class="w-full p-3 rounded-xl bg-gray-800 border border-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-500/60" />
        </div>
    </div>


    <!-- ✅ Finance Table -->
    <div class="overflow-hidden rounded-2xl border border-white/10 bg-gray-800 shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-black/40 text-gray-200 text-sm">
                <tr>
                    <th class="px-4 py-3">Car</th>
                    <th class="px-4 py-3">Year</th>
                    <th class="px-4 py-3">Price</th>
                    <th class="px-4 py-3">Monthly (6 Years)</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3">Availability</th>
                    <th class="px-4 py-3">Location</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                </tr>
                </thead>

                <tbody id="carsTbody" class="divide-y divide-white/10">

                <tr th:each="car : ${cars}" class="hover:bg-white/5 transition"
                    th:attr="data-search=${(car.brand + ' ' + car.model)}">

                    <!-- Car + Image -->
                    <td class="px-4 py-4">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-14 rounded-xl overflow-hidden bg-gray-700 flex-shrink-0">
                                <img th:if="${car.imagesBase64 != null && #lists.size(car.imagesBase64) > 0}"
                                     th:src="'data:image/jpeg;base64,' + ${car.imagesBase64[0]}"
                                     class="w-full h-full object-cover" alt="Car" />

                                <div th:if="${car.imagesBase64 == null || #lists.size(car.imagesBase64) == 0}"
                                     class="w-full h-full grid place-items-center text-gray-300 text-xs">
                                    No image
                                </div>
                            </div>

                            <div>
                                <div class="font-semibold text-lg"
                                     th:text="${car.brand + ' ' + car.model}">
                                    Brand Model
                                </div>
                                <div class="text-sm text-gray-300">
                                    ID: <span th:text="${car.id}">1</span>
                                </div>
                            </div>
                        </div>
                    </td>

                    <!-- Year -->
                    <td class="px-4 py-4 text-gray-200" th:text="${car.year}">2020</td>

                    <!-- Price -->
                    <td class="px-4 py-4">
                        <span class="text-yellow-300 font-semibold"
                              th:text="'$' + ${#numbers.formatDecimal(car.price,0,'COMMA',0,'POINT')}">
                            $10,000
                        </span>
                    </td>

                    <!-- Monthly 6 years -->
                    <td class="px-4 py-4">
                        <span class="text-emerald-300 font-semibold"
                              th:text="'$' + ${#numbers.formatDecimal(car.finance.monthlyPayment,0,'COMMA',0,'POINT')}"                            $200
                        </span>
                        <span class="text-xs text-gray-400">/ month</span>
                    </td>

                    <!-- Status -->
                    <td class="px-4 py-4">
                        <span th:text="${car.status}"
                              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-white/10 border border-white/10">
                            USED
                        </span>
                    </td>

                    <!-- Availability -->
                    <td class="px-4 py-4">
                        <span th:text="${car.availability}"
                              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-200 border border-emerald-500/30">
                            FINANCE
                        </span>
                    </td>

                    <!-- Location -->
                    <td class="px-4 py-4">
                        <span class="text-gray-200" th:text="${car.location}">Seattle</span>
                    </td>

                    <!-- Actions -->
                    <td class="px-4 py-4">
                        <div class="flex items-center justify-end gap-2">


                            <form th:action="@{/admin/cars/finance/{id}/pay(id=${car.finance.id})}"
                                  method="post">
                                <button type="submit"
                                        class="px-3 py-2 bg-yellow-500 text-black rounded hover:bg-yellow-600">
                                    Pay Month
                                </button>
                            </form>

                            <!-- View Details -->
                            <a th:href="@{/cars/{id}(id=${car.id})}"
                               class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                View
                            </a>

                            <!-- Setup Finance -->
                            <a th:href="@{/admin/cars/{id}/finance(id=${car.id})}"
                               class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">
                                Setup Finance
                            </a>

                        </div>
                    </td>

                </tr>

                <!-- If no cars -->
                <tr th:if="${cars == null || #lists.isEmpty(cars)}">
                    <td colspan="8" class="px-4 py-10 text-center text-gray-300">
                        No finance cars found.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</section>


<!-- ✅ Search Script -->
<script>
    const searchInput = document.getElementById("searchInput");

    if (searchInput) {
        searchInput.addEventListener("input", () => {
            const q = (searchInput.value || "").toLowerCase().trim();
            document.querySelectorAll("#carsTbody tr[data-search]").forEach(r => {
                const txt = (r.getAttribute("data-search") || "").toLowerCase();
                r.style.display = txt.includes(q) ? "" : "none";
            });
        });
    }
</script>

</body>
</html>
