<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Find Your Perfect Car</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<!-- ✅ Navigation Bar -->
<nav class="bg-black p-4 fixed w-full z-10">
    <div class="container mx-auto flex flex-wrap justify-between items-center gap-3">

        <!-- 🔍 Search Filters -->
        <form id="filterForm" class="flex flex-wrap items-center gap-2 w-full md:w-auto">
            <!-- ✅ MUST match enum: NEW / USED -->
            <select id="statusDropdown" class="p-2 rounded bg-gray-700 text-white">
                <option value="">All Status</option>
                <option value="USED">Used</option>
                <option value="NEW">New</option>
            </select>

            <!-- (Optional) if you have makes list from backend -->
            <select id="makeDropdown" class="p-2 rounded bg-gray-700 text-white">
                <option value="">All Makes</option>
                <option th:each="m : ${makes}" th:value="${m}" th:text="${m}"></option>
            </select>

            <select id="modelDropdown" class="p-2 rounded bg-gray-700 text-white">
                <option value="">All Models</option>
                <!-- If you want dynamic models later, we can do it -->
            </select>

            <select id="orderDropdown" class="p-2 rounded bg-gray-700 text-white">
                <option value="asc">Price Low to High</option>
                <option value="desc">Price High to Low</option>
            </select>

            <button type="button"
                    onclick="fetchFilteredCars()"
                    class="p-2 bg-yellow-500 text-black rounded hover:bg-yellow-600">
                Search
            </button>

            <button type="button"
                    onclick="resetFilters()"
                    class="p-2 bg-gray-700 text-white rounded hover:bg-gray-600">
                Reset
            </button>
        </form>

        <!-- 📩 Contact Button -->
        <a href="/contact" class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-green-600">
            Contact Us
        </a>
    </div>
</nav>

<!-- 🚗 Car Listings -->
<section class="pt-24 pb-10">
    <div class="container mx-auto px-3">

        <div id="carsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

            <!-- ✅ Thymeleaf initial cars -->
            <div th:each="car : ${cars}" class="bg-gray-800 p-4 rounded-2xl shadow-lg">

                <!-- ✅ image (show first only, stable, no moving) -->
                <div class="relative w-full h-56 md:h-72 overflow-hidden rounded-lg bg-gray-700">
                    <img th:if="${#lists.size(car.imagesBase64) > 0}"
                         th:src="'data:image/jpeg;base64,' + ${car.imagesBase64[0]}"
                         class="w-full h-full object-cover"
                         alt="Car Image"/>

                    <div th:if="${#lists.size(car.imagesBase64) == 0}"
                         class="w-full h-full flex items-center justify-center text-gray-300">
                        No Image
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <h3 th:text="${car.brand + ' ' + car.model}" class="text-lg font-semibold"></h3>
                    <p th:text="'$' + ${car.price}" class="text-yellow-500 font-medium"></p>
                    <p th:text="${car.status}" class="uppercase text-gray-400"></p>
                    <p th:text="'Year: ' + ${car.year}" class="text-sm text-gray-300"></p>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- 📝 JavaScript -->
<script>
    // ✅ Render cars into the grid
    function renderCars(cars) {
        const container = document.getElementById("carsGrid");
        if (!container) {
            console.error("carsGrid not found in HTML");
            return;
        }

        container.innerHTML = "";

        if (!cars || cars.length === 0) {
            container.innerHTML =
                "<p class='text-center text-white col-span-full'>No cars found</p>";
            return;
        }

        cars.forEach((car) => {
            const firstImg =
                car.imagesBase64 && car.imagesBase64.length > 0
                    ? `data:image/jpeg;base64,${car.imagesBase64[0]}`
                    : null;

            container.innerHTML += `
        <div class="bg-gray-800 p-4 rounded-2xl shadow-lg">
          <div class="relative w-full h-56 md:h-72 overflow-hidden rounded-lg bg-gray-700">
            ${
                firstImg
                    ? `<img src="${firstImg}" class="w-full h-full object-cover" alt="Car Image" />`
                    : `<div class="w-full h-full flex items-center justify-center text-gray-300">No Image</div>`
            }
          </div>

          <div class="mt-4 text-center">
            <h3 class="text-lg font-semibold">${car.brand ?? ""} ${car.model ?? ""}</h3>
            <p class="text-yellow-500 font-medium">$${car.price ?? ""}</p>
            <p class="uppercase text-gray-400">${car.status ?? ""}</p>
            <p class="text-sm text-gray-300">Year: ${car.year ?? ""}</p>
          </div>
        </div>
      `;
        });
    }

    // ✅ Fetch cars by filters (ONLY ONE function)
    function fetchFilteredCars() {
        const status = document.getElementById("statusDropdown")?.value || ""; // NEW/USED
        const make = document.getElementById("makeDropdown")?.value || "";
        const model = document.getElementById("modelDropdown")?.value || "";
        const order = document.getElementById("orderDropdown")?.value || "asc";

        // optional (only if inputs exist)
        const minPriceEl = document.getElementById("minPrice");
        const maxPriceEl = document.getElementById("maxPrice");
        const minPrice = minPriceEl ? minPriceEl.value : "";
        const maxPrice = maxPriceEl ? maxPriceEl.value : "";

        const params = new URLSearchParams();
        if (status) params.append("status", status);
        if (make) params.append("make", make);
        if (model) params.append("model", model);
        if (minPrice) params.append("minPrice", minPrice);
        if (maxPrice) params.append("maxPrice", maxPrice);
        params.append("order", order);

        const url = `/filter?${params.toString()}`;
        console.log("Fetching:", url);

        fetch(url, { headers: { Accept: "application/json" } })
            .then((res) => {
                const ct = res.headers.get("content-type") || "";
                if (!ct.includes("application/json")) {
                    // Usually means: redirect to login or HTML error page
                    throw new Error("Server did not return JSON (check security/controller).");
                }
                return res.json();
            })
            .then((data) => {
                console.log("Filtered cars:", data);
                renderCars(data);
            })
            .catch((err) => console.error("Error fetching cars:", err));
    }

    // ✅ Reset filters and reload the page
    function resetFilters() {
        const statusEl = document.getElementById("statusDropdown");
        const makeEl = document.getElementById("makeDropdown");
        const modelEl = document.getElementById("modelDropdown");
        const orderEl = document.getElementById("orderDropdown");

        if (statusEl) statusEl.value = "";
        if (makeEl) makeEl.value = "";
        if (modelEl) modelEl.value = "";
        if (orderEl) orderEl.value = "asc";

        // optional price inputs
        const minPriceEl = document.getElementById("minPrice");
        const maxPriceEl = document.getElementById("maxPrice");
        if (minPriceEl) minPriceEl.value = "";
        if (maxPriceEl) maxPriceEl.value = "";

        // easiest: reload original thymeleaf list
        window.location.href = "/";
    }

    // ✅ Load models when make changes
    function loadModels() {
        const make = document.getElementById("makeDropdown")?.value || "";
        const modelDropdown = document.getElementById("modelDropdown");

        if (!modelDropdown) return;

        modelDropdown.innerHTML = `<option value="">All Models</option>`;
        if (!make) return;

        fetch(`/models?make=${encodeURIComponent(make)}`, {
            headers: { Accept: "application/json" },
        })
            .then((res) => res.json())
            .then((models) => {
                (models || []).forEach((m) => {
                    const opt = document.createElement("option");
                    opt.value = m;
                    opt.textContent = m;
                    modelDropdown.appendChild(opt);
                });
            })
            .catch((err) => console.error("Error loading models:", err));
    }

    // ✅ Auto attach events
    document.addEventListener("DOMContentLoaded", () => {
        const makeDropdown = document.getElementById("makeDropdown");
        if (makeDropdown) {
            makeDropdown.addEventListener("change", () => {
                loadModels();
                // optional: auto-run filter when make changes
                // fetchFilteredCars();
            });
        }
    });
</script>


</body>
</html>
