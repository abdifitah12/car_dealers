<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
        }
        .register-container {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2 class="mb-4 text-center">Register</h2>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" th:field="*{name}" required />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" th:field="*{password}" required />
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" class="form-control" th:field="*{confirmPassword}" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>


    <div class="mt-3 text-center">
        <a href="/login" class="text-primary">Already have an account? Login here</a>
    </div>
</div>
</body>
</html>
