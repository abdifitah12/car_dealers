<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white flex items-center justify-center p-4">

<div class="w-full max-w-md rounded-2xl bg-gray-800 border border-white/10 p-6 shadow-xl">
    <h1 class="text-2xl font-extrabold">Reset Password</h1>
    <p class="text-gray-300 mt-1">Enter the passcode from your email.</p>

    <div th:if="${error}" class="mt-4 p-3 rounded-xl bg-red-500/15 border border-red-500/30 text-red-200"
         th:text="${error}"></div>

    <form class="mt-5 space-y-3" th:action="@{/reset-password}" method="post">
        <input type="email" name="email" required
               th:value="${email}"
               class="w-full p-3 rounded-xl bg-gray-900 border border-white/10 focus:ring-2 focus:ring-yellow-500/60"
               placeholder="you@example.com" />

        <input type="text" name="code" required maxlength="6"
               class="w-full p-3 rounded-xl bg-gray-900 border border-white/10 focus:ring-2 focus:ring-yellow-500/60"
               placeholder="6-digit passcode" />

        <input type="password" name="newPassword" required
               class="w-full p-3 rounded-xl bg-gray-900 border border-white/10 focus:ring-2 focus:ring-yellow-500/60"
               placeholder="New password" />

        <input type="password" name="confirmPassword" required
               class="w-full p-3 rounded-xl bg-gray-900 border border-white/10 focus:ring-2 focus:ring-yellow-500/60"
               placeholder="Confirm new password" />

        <button class="w-full p-3 rounded-xl bg-yellow-500 text-black font-semibold hover:bg-yellow-600">
            Change Password
        </button>

        <a href="/forgot-password" class="block text-center text-sm text-gray-300 hover:text-white mt-2">
            Resend code
        </a>
    </form>
</div>

</body>
</html>
