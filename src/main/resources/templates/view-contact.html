<!-- view-contact.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Contact Details</h2>

    <p><strong>Name:</strong> <span th:text="${contact.name}"></span></p>
    <p><strong>Email:</strong> <span th:text="${contact.email}"></span></p>
    <p><strong>Phone:</strong> <span th:text="${contact.phone}"></span></p>
    <p><strong>Address:</strong> <span th:text="${contact.address}"></span></p>
    <p><strong>Message:</strong> <span th:text="${contact.message}"></span></p>
    <p><strong>Send Date:</strong> <span th:text="${#temporals.format(contact.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>

    <a href="javascript:history.back()" class="inline-block mt-4 text-blue-500 underline">Back</a>
</div>
</body>
</html>
