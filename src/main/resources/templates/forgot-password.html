<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white flex items-center justify-center p-4">

<div class="w-full max-w-md rounded-2xl bg-gray-800 border border-white/10 p-6 shadow-xl">
    <h1 class="text-2xl font-extrabold">Forgot Password</h1>
    <p class="text-gray-300 mt-1">Enter your email to receive a passcode.</p>

    <div th:if="${msg}" class="mt-4 p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-200"
         th:text="${msg}"></div>

    <form class="mt-5 space-y-3" th:action="@{/forgot-password}" method="post">
        <input type="email" name="email" required
               class="w-full p-3 rounded-xl bg-gray-900 border border-white/10 focus:ring-2 focus:ring-yellow-500/60"
               placeholder="you@example.com" />

        <button class="w-full p-3 rounded-xl bg-yellow-500 text-black font-semibold hover:bg-yellow-600">
            Send Passcode
        </button>

        <a href="/login" class="block text-center text-sm text-gray-300 hover:text-white mt-2">Back to Login</a>
    </form>
</div>

</body>
</html>
