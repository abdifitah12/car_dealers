<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="container mx-auto mt-10">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-semibold">Contact List</h2>

        <!-- 🔍 Search Bar -->
        <input type="text" id="searchInput" onkeyup="searchContacts()"
               class="p-2 border rounded w-1/3"
               placeholder="Search by name or email">
    </div>

    <!-- Contact Table -->
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white rounded-lg shadow-md">
            <thead class="bg-gray-800 text-white">
            <tr>
                <th class="px-4 py-2">ID</th>
                <th class="px-4 py-2">Name</th>
                <th class="px-4 py-2">Email</th>
                <th class="px-4 py-2">Message</th>
                <th class="px-4 py-2">Phone</th>
                <th class="px-4 py-2">Address</th>
                <th class="px-4 py-2">Actions</th>
            </tr>
            </thead>
            <tbody id="contactTable">
            <tr th:each="contact : ${contacts}" class="border-b">
                <td class="px-4 py-2" th:text="${contact.id}"></td>
                <td class="px-4 py-2" th:text="${contact.name}"></td>
                <td class="px-4 py-2" th:text="${contact.email}"></td>
                <td class="px-4 py-2 truncate max-w-xs" th:text="${contact.message}"></td>
                <td class="px-4 py-2" th:text="${contact.phone}"></td>
                <td class="px-4 py-2" th:text="${contact.address}"></td>
                <td class="px-4 py-2">
                    <form th:action="@{/contacts/delete/{id}(id=${contact.id})}" method="post"
                          onsubmit="return confirm('Are you sure you want to delete this contact?')">
                        <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-700">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination Controls -->
    <div class="flex justify-center mt-4">
        <button id="prevPage" class="px-3 py-2 bg-gray-500 text-white rounded mx-1" onclick="prevPage()">Prev</button>
        <span id="pageInfo" class="text-gray-700 mx-2">Page 1</span>
        <button id="nextPage" class="px-3 py-2 bg-gray-500 text-white rounded mx-1" onclick="nextPage()">Next</button>
    </div>
</div>

<!-- 📝 JavaScript -->
<script>
    function displayFilteredCars(cars) {
        const container = document.querySelector(".grid");
        container.innerHTML = "";

        if (!cars || cars.length === 0) {
            container.innerHTML = "<p class='text-center text-white'>No cars found</p>";
            return;
        }

        cars.forEach(car => {
            container.innerHTML += `
      <div class="bg-gray-800 p-4 rounded-2xl shadow-lg">
        <div class="flex space-x-2 overflow-x-auto no-scrollbar">
          ${(car.imagesBase64 || []).map(image => `
            <div class="flex-none w-1/4">
              <img src="data:image/jpeg;base64,${image}" class="w-full h-48 object-cover rounded-lg">
            </div>
          `).join('')}
        </div>
        <div class="mt-4 text-center">
          <h3 class="text-lg font-semibold">${car.brand} ${car.model}</h3>
          <p class="text-yellow-500 font-medium">$${car.price}</p>
          <p class="uppercase text-gray-400">${car.status}</p>
          <p class="text-sm text-gray-300">Year: ${car.year}</p>
        </div>
      </div>`;
        });
    }

    function fetchFilteredCars() {
        const status = document.getElementById("statusDropdown").value.toUpperCase();
        const make = document.getElementById("makeDropdown").value || null;
        const model = document.getElementById("modelDropdown").value || null;
        const order = document.getElementById("orderDropdown").value;

        const queryParams = new URLSearchParams();
        if (status) queryParams.append("status", status);
        if (make) queryParams.append("make", make);
        if (model) queryParams.append("model", model);
        queryParams.append("order", order);

        fetch(`/filter?${queryParams.toString()}`)
            .then(r => r.json())
            .then(data => displayFilteredCars(data))
            .catch(err => console.error(err));
    }
</script>


</body>
</html>
