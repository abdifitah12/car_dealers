<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* container */
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;

            /* IMPORTANT FIXES */
            opacity: 1 !important;
            pointer-events: auto !important;
            position: relative;
            z-index: 10;
        }

        .form-control {
            height: 45px;
        }

        .btn-primary {
            height: 45px;
            font-size: 16px;
        }

        .error-message {
            color: #dc3545;
            background: #f8d7da;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555;
        }

        a.link {
            color: #007bff;
        }

        a.link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2 class="mb-4 text-center">Sign In</h2>

    <!-- Error message from Spring Security -->
    <div th:if="${param.error}" class="error-message">
        Invalid username or password. Please try again.
    </div>

    <!-- Logout success message -->
    <div th:if="${param.logout}" class="alert alert-success text-center">
        You have been logged out successfully.
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text"
                   class="form-control"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required />
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
            Sign In
        </button>

        <div class="mt-3 text-center">
            <a href="/forgot-password" class="link">Forgot your password?</a>
        </div>

    </form>

    <div class="mt-3 text-center">
        <a href="/register" class="link">Don't have an account? Register here</a>
    </div>
</div>

<!-- JS -->
<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;
        togglePassword.classList.toggle("fa-eye-slash");
    });
</script>

</body>
</html>
